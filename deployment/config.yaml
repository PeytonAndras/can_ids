# Deployment configuration for RAMN + CARLA real-time IDS
window_ms: 100
smoothing:
  consecutive_windows: 1  # No smoothing - immediate detection
models:
  isolation_forest: ../models/unsupervised/real_can0/isolation_forest.joblib
  pca: ../models/unsupervised/real_can0/pca_reconstruction.joblib
thresholds: ../results/unsupervised/real_can0/thresholds.json
ensemble: logical_or  # Use either detector - PCA threshold adjusted for live traffic
logging:
  path: logs/alerts.jsonl
  level: INFO
telemetry:
  http_port: 8080

# Rate-based detection configuration
rate_detection:
  enabled: true
  # Track rates over this many seconds (long-term baseline)
  history_window_seconds: 30.0
  # Short-term window for faster adaptation (detection and normalization)
  short_term_window_seconds: 10.0
  # Minimum samples needed before alerting (reduced for faster detection)
  min_samples: 5
  # Alert if rate deviates by this many standard deviations
  rate_deviation_threshold: 3.0
  # Alert if rate is above this multiplier of mean
  rate_multiplier_threshold: 2.0
  # Alert if rate is below this fraction of mean (for low-volume attacks)
  rate_minimum_threshold: 0.1
  # Alert if timing regularity is too high (CV < threshold means very regular)
  # NOTE: Normal CAN traffic IS regular, so we only alert on EXTREME regularity
  # or when regularity changes significantly from baseline
  regularity_threshold: 0.005
  # Alert if timing is too irregular (CV > threshold)
  irregularity_threshold: 2.0
  # Monitor specific IDs (empty = monitor all). Use hex strings like "0x039" or integers
  monitored_ids: []
  # Ignore these IDs
  ignored_ids: []
